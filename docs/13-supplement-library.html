const ALL = Object.values(CERTIFIED_SUPPLEMENTS);

function certBadges(s){
  const b=[];
  if(s.is) b.push("Informed Sport");
  if(s.nsf) b.push("NSF Certified for Sport");
  return b;
}

// ═══════════════════════════════════════════════════════════════════
// RECOMMENDATION ENGINE — same filter → score → rank pattern as
// Bridge's compliance-weighted confidence scoring elsewhere in the platform.
// ═══════════════════════════════════════════════════════════════════
function getRecommendation({ age, allergies, category }) {
  let pool = ALL.filter(s => {
    if (category && s.cat !== category) return false;
    if (age < s.ageMin || age > s.ageMax) return false;
    if (s.allergens.some(a => allergies.includes(a))) return false;
    return true;
  });
  pool.sort((a, b) => {
    const score = x => (x.is ? 1 : 0) + (x.nsf ? 1 : 0) + (x.grade === "A" ? 1 : 0);
    return score(b) - score(a);
  });
  return { primary: pool[0] || null, alternatives: pool.slice(1, 4) };
}

function Badge({ children, tone }) {
  const tones = { is: "#00c9a7", nsf: "#4cc9f0", grade: "#f5a623", warn: "#ef476f" };
  return <span style={{background:`${tones[tone]}22`,color:tones[tone],border:`1px solid ${tones[tone]}55`,borderRadius:6,padding:"3px 8px",fontSize:11,fontWeight:600,marginRight:6,display:"inline-block",marginBottom:4}}>{children}</span>;
}

function SupplementCard({ s }) {
  return (
    <div className="fade-in" style={{background:"#0d1e38",border:"1px solid #13274a",borderRadius:12,padding:16,marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <div style={{color:"#e8f0fe",fontWeight:700,fontSize:15}}>{s.name}</div>
          <div style={{color:"#7a8bab",fontSize:12}}>{s.brand} · {s.cat}</div>
        </div>
        <span style={{color:s.color,fontFamily:"'DM Mono',monospace",fontSize:11}}>Grade {s.grade}</span>
      </div>
      <div style={{margin:"8px 0"}}>
        {s.is && <Badge tone="is">Informed Sport</Badge>}
        {s.nsf && <Badge tone="nsf">NSF Certified for Sport</Badge>}
        <Badge tone="grade">Ages {s.ageMin}+</Badge>
        {s.allergens.map(a => <Badge key={a} tone="warn">Contains {ALLERGENS.find(x=>x.key===a)?.label || a}</Badge>)}
      </div>
      <div style={{color:"#c3cfe6",fontSize:13,lineHeight:1.5,marginBottom:8}}>{s.desc}</div>
      <div style={{color:"#7a8bab",fontSize:12}}><b style={{color:"#c3cfe6"}}>Dosage:</b> {s.dosing}</div>
      <div style={{color:"#7a8bab",fontSize:12}}><b style={{color:"#c3cfe6"}}>Timing:</b> {s.timing.join(" · ")}</div>
    </div>
  );
}

// -> { primary: {...}, alternatives: [{...}, {...}, {...}] }`;

  return (

      <h3 style={{color:"#e8f0fe",marginBottom:8}}>Integration notes</h3>

      <p style={{marginTop:10}}>Merge strategy: <code>Object.assign(SUPPLEMENTS, CERTIFIED_SUPPLEMENTS)</code>, then anywhere the platform reads from <code>SUPPLEMENTS</code>, add an <code>.filter(s =&gt; s.is || s.nsf)</code> guard if that view must be certified-only (e.g. the athlete-facing prescription engine), or leave ungated for internal/admin views that also show non-certified clinical products (Pedialyte, PediaSure, Ensure, etc. remain valid — they're medical nutrition, not doping-risk supplements).</p>
      <pre style={{background:"#0d1e38",border:"1px solid #13274a",borderRadius:10,padding:14,marginTop:10,color:"#9be9d8",fontSize:12,overflowX:"auto"}}>{snippet}</pre>
      <h3 style={{color:"#e8f0fe",margin:"18px 0 8px"}}>Sourcing basis for brands beyond the original set</h3>
      <p><b>Nutrition X</b> — confirmed via both the brand's own Informed Sport certification page and Informed Sport's brand directory: the entire commercial range is Informed-Sport batch tested (a sponsor/team-supply brand commonly used by pro academies for exactly this reason — full-range coverage removes SKU-by-SKU guesswork). All 21 Nutrition X SKUs added here (protein, creatine, hydration, race fuel, performance, recovery, micronutrient) came directly off that range.</p>
      <p style={{marginTop:8}}><b>Kinetica Sports</b> — confirmed via the brand's own testing/certification page and independent press coverage of its partnership as Fulham FC's official sports nutrition supplier; the brand states the "majority" (not literally 100%) of its range is Informed Sport certified, so treat any Kinetica SKU not listed here as unverified rather than assuming coverage.</p>
      <p style={{marginTop:8}}><b>Applied Nutrition</b> — confirmed via Informed Sport's own brand directory page for Applied Nutrition and a historical Informed Sport certified-products register showing specific certified SKUs (Critical Whey, Recovery, BCAA Amino-Hydrate, among others); only those corroborated SKUs were added, not the brand's full catalogue.</p>
      <p style={{marginTop:8}}><b>Science in Sport (SiS)</b> — SiS states 100% of its range holds both Informed Manufacturer and Informed Sport product certification, so its BCAA, glutamine, Beta Fuel/electrolyte gels and Athlete Health multivitamin were added alongside the gels already in the library.</p>
      <p style={{marginTop:8}}><b>Grenade</b> — Carb Killa High Protein Bar specifically confirmed via retail listings citing Informed Sport certification and allergen declaration (milk, soy); other Grenade SKUs (BCAA, creatine, additional protein lines) appear on Informed Sport's brand directory but weren't added without a confirmed product name.</p>
      <p style={{marginTop:8}}><b>NUTRITECH</b> (South Africa) — ProSport Creatine Monohydrate confirmed Informed Sport certified via the brand's own product page ("Informed Sport Certified – Every Batch Tested").</p>
      <p style={{marginTop:8}}><b>Fluid Sports Nutrition</b> — confirmed via the brand's dedicated Informed Sport certification page; Fluid Performance (hydration/carb) and Fluid Recovery (vegan pea-protein recovery) added from its certified hydration/protein/recovery/creatine/collagen range.</p>
      <p style={{marginTop:8}}><b>Healthspan Elite</b> — Official Sports Nutrition Partner of the All Blacks; entire range confirmed Informed Sport certified via the brand's own FAQ and Informed Sport's brand directory. Sport Essentials (omega-3 + multivitamin + probiotic) added as the representative micronutrient SKU.</p>
      <p style={{marginTop:8}}><b>Veloforte</b> — confirmed via Informed Sport's brand directory (electrolyte/carbohydrate and plant-protein/probiotic product types) and ESSNawards coverage naming Vita and Nova specifically as Informed Sport certified products.</p>
      <p style={{marginTop:8}}><b>Beet It (James White Drinks)</b> — expanded from one to two SKUs: added Beet It Sport Nitrate 3000, the same Informed Sport certified 400mg-nitrate formulation as Nitrate 400 in a bulk 250ml team-supply bottle. Worth flagging: Beet It's own FAQ explicitly confirms the standard "Organic Shot" line (including ginger/turmeric variants) is <i>not</i> Informed Sport certified — only the "Sport" branded range is. Don't assume brand-wide coverage from a certified flagship SKU; check the specific product line.</p>
      <p style={{marginTop:8}}><b>Sponser Sport Food</b> (Switzerland) — investigated on request and <i>not added</i>. Sponser's own materials describe an internal QA stack (GMP, ISO FSSC 22000, HACCP) and a general "anti-doping commitment," but no source found confirms Informed Sport or NSF Certified for Sport certification for any Sponser product. Evidence instead points to the Kölner Liste (Cologne List) — a separate, German NADA-affiliated batch-testing programme — as Sponser's likely certification route, which doesn't meet this build's Informed Sport / NSF Certified for Sport requirement. If Sponser certification info surfaces later (e.g. a specific SKU confirmed on sport.wetestyoutrust.com or nsfsport.com), it can be added then — but nothing here should be read as Sponser being certified under either named programme.</p>
      <p style={{marginTop:8}}><b>Removed:</b> "BPN Electrolytes" (Bare Performance Nutrition) was dropped from this build after verification turned up an Informed Sport programme record showing it was <i>voluntarily withdrawn</i> from that certification on 06-Sep-2024. This is the exact scenario the verification protocol below exists to catch — a product that was legitimately certified when a dataset was first built can lapse later. BPN's Creatine Monohydrate (NSF Certified for Sport) was unaffected and remains in the library.</p>
      <h3 style={{color:"#e8f0fe",margin:"18px 0 8px"}}>Verification protocol (do this before production use)</h3>
      <p>Certification status is not static — brands add and drop SKUs from these programmes, and batches can lapse between manufacturing runs (see the BPN Electrolytes example above). Before this list goes live for athlete-facing prescriptions:</p>
      <ol style={{marginLeft:18,marginTop:6}}>
        <li>Cross-check every SKU against the live Informed Sport registry: <code>sport.wetestyoutrust.com/certified-brands</code></li>
        <li>Cross-check every SKU against the live NSF Certified for Sport search: <code>nsfsport.com/certified-products</code></li>
        <li>Re-run this check on a recurring schedule (recommend monthly, or before each new team supplement order cycle) and log the check date per SKU.</li>
        <li>Flag any SKU that drops off either registry for immediate removal from athlete protocols, not just the next data refresh.</li>
      </ol>
      <h3 style={{color:"#e8f0fe",margin:"18px 0 8px"}}>Age-band policy applied in this build</h3>
      <p>12–13: hydration, protein, and core micronutrients only. 14–15: adds race fuel/carb and nitrate. 15–17: creatine and recovery protein permitted <i>with documented practitioner sign-off</i> (tagged <code>U18-practitioner-review</code>). 16+: beta-alanine and caffeine unlocked. Iron is physician-directed at any age (diagnosed deficiency only) — never a blanket prescription.</p>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("library");
  return (
    <div style={{minHeight:"100vh",padding:"24px 20px",maxWidth:960,margin:"0 auto"}}>
      <div style={{marginBottom:20}}>
        <div style={{color:"#e8f0fe",fontSize:22,fontWeight:800}}>🌉 Bridge — Certified Supplement Module</div>
        <div style={{color:"#7a8bab",fontSize:13,marginTop:4}}>{ALL.length} Informed Sport / NSF Certified for Sport products across {new Set(ALL.map(s=>s.brand)).size} brands · categorised by type, age (12+), and allergy/intolerance</div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:20,borderBottom:"1px solid #13274a"}}>
        {[["library","Certified Library"],["recommend","Athlete Recommender"],["dev","Developer Docs"]].map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)} style={{background:"none",border:"none",borderBottom:tab===k?"2px solid #00c9a7":"2px solid transparent",color:tab===k?"#00c9a7":"#7a8bab",padding:"10px 4px",fontWeight:600,fontSize:13,cursor:"pointer"}}>{l}</button>
        ))}
      </div>
      {tab==="library" && <LibraryView />}
      {tab==="recommend" && <RecommenderView />}
      {tab==="dev" && <DevDocsView />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
